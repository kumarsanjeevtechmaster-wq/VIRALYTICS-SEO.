<!doctype html>
<!--
  VIRALYSTICS SEO Command Center — offline single-file build
  No npm, no CDN, no fonts, no network calls. Open this file and it works.
  Build source: build/app.css + build/seed.js + build/app.js  (run ./build.sh)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIRALYSTICS · SEO Command Center</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23b7f24a'/><text x='16' y='23' font-family='system-ui' font-size='19' font-weight='800' text-anchor='middle' fill='%230a0b0d'>V</text></svg>">
<style>
/* VIRALYSTICS SEO Command Center — offline, zero-dependency */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0b0d; --panel:#111317; --panel2:#15181d; --line:#21262d; --line2:#2b323b;
  --tx:#e6e8ea; --tx2:#9aa4b0; --tx3:#6a7480;
  --lime:#b7f24a; --blue:#3b82f6; --red:#ef4444; --amber:#f59e0b; --green:#22c55e; --violet:#8b5cf6;
  --r:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:13px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Devanagari",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
::selection{background:rgba(183,242,74,.28)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
#side{border-right:1px solid var(--line);background:#0c0e11;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.brand{display:flex;gap:9px;align-items:center;padding:14px 14px 12px;border-bottom:1px solid var(--line)}
.logo{width:26px;height:26px;border-radius:7px;background:var(--lime);color:#0a0b0d;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.5px}
.brand b{font-size:13px;letter-spacing:-.2px}
.brand small{display:block;color:var(--tx3);font-size:10px;letter-spacing:.4px;text-transform:uppercase}
nav{padding:8px 8px 4px;overflow-y:auto;flex:1;scrollbar-width:thin}
.grp{color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.7px;padding:12px 8px 5px}
.nav-i{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;color:var(--tx2);cursor:pointer;user-select:none;border:1px solid transparent}
.nav-i:hover{background:var(--panel);color:var(--tx)}
.nav-i.on{background:var(--panel2);color:var(--tx);border-color:var(--line2)}
.nav-i .dot{width:6px;height:6px;border-radius:50%;background:var(--line2);flex:none}
.nav-i.on .dot{background:var(--lime)}
.nav-i .badge{margin-left:auto;font-size:10px;background:var(--line);color:var(--tx2);padding:1px 6px;border-radius:20px}
.nav-i .badge.hot{background:rgba(239,68,68,.16);color:#fca5a5}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;font-size:11px;color:var(--tx3)}
.meter{height:5px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;background:var(--lime)}
.meter i.warn{background:var(--amber)} .meter i.bad{background:var(--red)}
#main{min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:rgba(10,11,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:10px;align-items:center}
header.top h1{font-size:15px;font-weight:650;letter-spacing:-.2px;white-space:nowrap}
.hspace{flex:1}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:11.5px;color:var(--tx2);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--line2);color:var(--tx)}
.chip b{color:var(--tx);font-weight:600}
.chip.free{border-color:rgba(183,242,74,.35);color:#d6f7a0;background:rgba(183,242,74,.07)}
.chip.danger{border-color:rgba(239,68,68,.4);color:#fca5a5;background:rgba(239,68,68,.08)}
main{padding:16px 18px 60px;max-width:1620px;width:100%}

/* ---------- cards / grids ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;min-width:0}
.card h3{font-size:12px;font-weight:600;color:var(--tx2);display:flex;align-items:center;gap:7px;margin-bottom:9px}
.card h3 .sp{flex:1}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g-2-1,.g-1-2{grid-template-columns:1fr}}
@media(max-width:760px){#app{grid-template-columns:1fr}#side{position:fixed;left:-260px;width:236px;z-index:60;transition:left .2s}#side.open{left:0}main{padding:12px}.g2,.g3,.g4{grid-template-columns:1fr}header.top{flex-wrap:wrap}}
.kpi{font-size:25px;font-weight:680;letter-spacing:-.8px}
.kpi.s{font-size:19px}
.sub{color:var(--tx3);font-size:11.5px}
.up{color:var(--green)} .dn{color:var(--red)} .flat{color:var(--tx3)}
.hr{height:1px;background:var(--line);margin:11px 0}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line2);color:var(--tx2);background:#0f1114;white-space:nowrap}
.tag.crit{border-color:rgba(239,68,68,.45);color:#fca5a5;background:rgba(239,68,68,.09)}
.tag.imp{border-color:rgba(245,158,11,.45);color:#fbbf24;background:rgba(245,158,11,.09)}
.tag.pass{border-color:rgba(34,197,94,.4);color:#86efac;background:rgba(34,197,94,.09)}
.tag.info{border-color:rgba(59,130,246,.4);color:#93c5fd;background:rgba(59,130,246,.09)}
.tag.est{border-color:var(--line);color:var(--tx3)}
.tag.lime{border-color:rgba(183,242,74,.4);color:#d6f7a0;background:rgba(183,242,74,.08)}
.tag.violet{border-color:rgba(139,92,246,.45);color:#c4b5fd;background:rgba(139,92,246,.1)}

/* ---------- buttons ---------- */
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:12px;display:inline-flex;gap:7px;align-items:center;color:var(--tx)}
.btn:hover{border-color:#3d4550;background:#1a1e24}
.btn.pri{background:var(--lime);color:#0a0b0d;border-color:transparent;font-weight:650}
.btn.pri:hover{background:#c7ff5f}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{color:var(--tx);background:var(--panel)}
.btn.sm{padding:3px 8px;font-size:11px;border-radius:7px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.danger{border-color:rgba(239,68,68,.4);color:#fca5a5}

/* ---------- tables ---------- */
.tbl-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:auto;background:var(--panel);max-height:560px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
thead th{position:sticky;top:0;background:#14181d;text-align:left;padding:8px 10px;font-weight:600;color:var(--tx2);font-size:11px;white-space:nowrap;border-bottom:1px solid var(--line2);z-index:2;cursor:pointer;user-select:none}
thead th:hover{color:var(--tx)}
thead th.n,td.n{text-align:right}
tbody td{padding:7px 10px;border-bottom:1px solid #191d22;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#14181d}
tbody tr.sel td{background:rgba(183,242,74,.07)}
td .kw{font-weight:600;color:var(--tx)}
td.mono, .mono{font-family:var(--mono);font-size:11px;color:var(--tx2)}
.bar{height:5px;border-radius:4px;background:var(--line);overflow:hidden;min-width:44px}
.bar i{display:block;height:100%;background:var(--lime)}
.bar.blue i{background:var(--blue)} .bar.amber i{background:var(--amber)} .bar.red i{background:var(--red)} .bar.violet i{background:var(--violet)}
.urlcell{max-width:290px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--tx2)}
.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input[type=search],input[type=text],input[type=number],select,textarea{background:#0e1013;border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font-size:12px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:#4b5563;outline:none}
.filters .count{color:var(--tx3);font-size:11px;margin-left:auto}

/* ---------- score ring / heatmap / charts ---------- */
.ring{display:flex;align-items:center;gap:14px}
.ring svg{flex:none}
.ring .big{font-size:40px;font-weight:700;letter-spacing:-1.6px;line-height:1}
.subscore{display:grid;grid-template-columns:132px 1fr 34px;gap:8px;align-items:center;font-size:11.5px;color:var(--tx2)}
.heat{display:grid;gap:2px;grid-auto-flow:column}
.heat b{border-radius:2px;min-width:8px;height:13px;background:var(--line);font-weight:400}
.spark{display:block;width:100%;height:34px}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:26px;text-align:center;color:var(--tx3);background:#0d0f12}
.empty b{display:block;color:var(--tx2);font-size:13px;margin-bottom:5px}

/* ---------- drawer + modal ---------- */
#drawer,#modal{position:fixed;inset:0;display:none;z-index:80}
#drawer.on,#modal.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.drawer-p{position:absolute;right:0;top:0;bottom:0;width:min(720px,96vw);background:#0f1216;border-left:1px solid var(--line2);overflow:auto;padding:16px 18px}
.modal-p{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(880px,94vw);max-height:88vh;overflow:auto;background:#0f1216;border:1px solid var(--line2);border-radius:14px;padding:16px 18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.x{position:sticky;float:right;top:4px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;width:26px;height:26px;cursor:pointer;color:var(--tx2)}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.diff .box{background:#0c0e11;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-word}
.diff .box.bad{border-color:rgba(239,68,68,.35)} .diff .box.good{border-color:rgba(34,197,94,.35)}
.diff h5{font-family:inherit;font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;font-weight:600}
.snippet{background:#0c0e11;border:1px solid var(--line);border-radius:9px;padding:10px;font-family:var(--mono);font-size:11.5px;color:#c8f0a0;white-space:pre-wrap;word-break:break-word}

/* ---------- misc ---------- */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list-i{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #171b20}
.list-i:last-child{border-bottom:0}
.pill{font-size:10.5px;padding:2px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);color:var(--tx2);cursor:pointer}
.pill.on{background:rgba(183,242,74,.12);border-color:rgba(183,242,74,.4);color:#d6f7a0}
.note{background:#0d1208;border:1px solid rgba(183,242,74,.22);border-radius:10px;padding:9px 11px;font-size:11.5px;color:#cde8a8}
.note.warn{background:#150d05;border-color:rgba(245,158,11,.3);color:#fcd9a0}
.note.red{background:#150606;border-color:rgba(239,68,68,.3);color:#fca5a5}
.note.blue{background:#070e18;border-color:rgba(59,130,246,.28);color:#a8c8fb}
#toasts{position:fixed;right:14px;bottom:14px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:390px}
.toast{background:#14181d;border:1px solid var(--line2);border-left:3px solid var(--lime);border-radius:10px;padding:9px 12px;font-size:12px;box-shadow:0 12px 36px rgba(0,0,0,.5);animation:tin .18s ease-out}
.toast.bad{border-left-color:var(--red)} .toast.warn{border-left-color:var(--amber)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
#palette{position:fixed;inset:0;z-index:100;display:none;background:rgba(0,0,0,.6);padding-top:12vh;justify-content:center}
#palette.on{display:flex}
.pal{width:min(620px,94vw);height:max-content;max-height:64vh;background:#12161b;border:1px solid var(--line2);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pal input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:13px 15px;background:transparent;font-size:14px}
.pal .res{overflow:auto;padding:6px}
.pal .hit{padding:8px 10px;border-radius:9px;cursor:pointer;display:flex;gap:9px;align-items:center;font-size:12.5px}
.pal .hit.on,.pal .hit:hover{background:var(--panel2)}
.pal .hit span{color:var(--tx3);font-size:11px;margin-left:auto}
#banner{border-bottom:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.09);color:#fcd9a0;padding:7px 18px;font-size:11.5px;display:flex;gap:10px;align-items:center}
#banner b{color:#fde68a}
.prose{font-size:12.5px;color:var(--tx2)} .prose b{color:var(--tx)} .prose p{margin:0 0 7px}
.prose ul{margin:0 0 8px 16px} .prose li{margin-bottom:3px}
.why{background:#0d1014;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:11.5px;color:var(--tx2)}
.why .r{display:grid;grid-template-columns:118px 1fr 40px;gap:8px;align-items:center;margin-top:5px;font-size:11px}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--tx3);background:#0e1013}
.scroll-x{overflow-x:auto}
details{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel);margin-bottom:8px}
summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--tx2);list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";color:var(--tx3)}
details[open] summary:before{content:"▾ "}
@media print{
  #side,header.top,#toasts,.filters,.btn,.no-print{display:none!important}
  #app{display:block} main{padding:0;max-width:none} body{background:#fff;color:#111;font-size:11px}
  .card{border:1px solid #ccc;background:#fff;break-inside:avoid;box-shadow:none}
  .tag,.note,.why,.snippet{background:#f6f6f6!important;color:#111!important;border-color:#ddd!important}
  .tbl-wrap{max-height:none;overflow:visible;border-color:#ccc;background:#fff}
  thead th{background:#eee;color:#111;position:static} tbody td{border-color:#eee}
  .grid{display:grid} #reportOnly{display:block!important}
}

/* ---------- status colouring for approval rows + scatter interaction ---------- */
.scat circle{cursor:pointer;transition:fill-opacity .12s}
.scat circle:hover{fill-opacity:1;stroke:#e6e8ea;stroke-width:1.2}
.tag.pending{background:rgba(245,158,11,.14);color:#fbbf24;border-color:rgba(245,158,11,.35)}
.tag.approved{background:rgba(59,130,246,.14);color:#93c5fd;border-color:rgba(59,130,246,.35)}
.tag.applied{background:rgba(34,197,94,.14);color:#86efac;border-color:rgba(34,197,94,.35)}
.tag.rejected,.tag.cancelled{background:rgba(239,68,68,.13);color:#fca5a5;border-color:rgba(239,68,68,.3)}
.tag.reverted{background:rgba(139,92,246,.14);color:#c4b5fd;border-color:rgba(139,92,246,.32)}

/* --- print (white-label PDF) --- */
@media print{
  body{background:#fff!important;color:#111!important}
  .kpi,.sub,.urlcell,.kw,.mono,h1,h2,h3,b,td,th{color:#111!important}
  .sub,.urlcell,.mono{color:#555!important}
  #reportView{border:none;padding:0}
  .card{padding:9px 10px}
  .tbl-wrap{max-height:none!important}
  .spark polyline{stroke:#111!important}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <div id="main">
    <header class="top" id="top"></header>
    <main id="view"></main>
  </div>
</div>

<div class="modal" id="modal"></div>
<div id="toasts"></div>

<!-- ============================ DATA LAYER ============================
     The app reads window.DATA if present, otherwise the seeded demo set in
     seed.js. To plug in real numbers: run tools/ingest.js (free Google APIs,
     your own OAuth client) and drop data/*.json next to this file — or replace
     the window.DATA assignment below. No code changes are needed anywhere else.
===================================================================== -->
<script>
/* optional runtime loader — only works when served over http(s), harmless on file:// */
window.__loadData = async function(){
  try{
    const j = await (await fetch('./data/site.json',{cache:'no-store'})).json();
    window.DATA = Object.assign(window.DATA||{}, j);
    try{ const k = await (await fetch('./data/keywords.json',{cache:'no-store'})).json();
         if(k && k.rows) window.DATA.keywords = k.rows; }catch(e){}
    console.info('[data] loaded ./data/*.json — live numbers in use');
  }catch(e){ console.info('[data] no ./data/site.json — running on the seeded demo set'); }
};
window.__READY = (location.protocol.startsWith('http') ? window.__loadData() : Promise.resolve());
</script>

<script>
/* =============================================================================
   SEED DATA — fictional demo dataset.
   Why seeded: this build is 100% free/offline. Live Google numbers require each
   site owner's OAuth consent, which a file:// page cannot do. Same code paths
   render real data once ingest.js writes JSON pulled from your own connected APIs.
   ============================================================================= */
const SITE={domain:'viralytics-demo.io',brand:'Viralytics',scheme:'https'};
const FREE=1; /* badge: every data source here costs ₹0 */

/* ---------------------------------------------------------------- RULES
  se: 0 critical · 1 improvement · 2 notice | scope: page|site */
const RULES=[
{code:'title_missing',t:'Missing title tag',se:0,cat:'onpage',w:6,scope:'page',
 why:'A page with no title gives Google nothing to name the result with, so it invents one from the URL.',
 fix:'Add a unique 30–60 char title naming the topic plus one qualifier.',
 snip:'<title>AI Reel Generator for 9:16 Video — Viralytics</title>'},
{code:'title_duplicate',t:'Duplicate titles',se:0,cat:'onpage',w:6,scope:'page',
 why:'Identical titles on different URLs blur which page should rank, and the template never differentiates.',
 fix:'Differentiate by the page’s actual purpose; put the brand at the end.',
 snip:'<title>AI Reel Generator — Viralytics</title>   /* was "Features — Viralytics" */'},
{code:'title_long',t:'Title truncated in the SERP',se:1,cat:'onpage',w:1.5,scope:'page',
 why:'Past ~60 characters the part that earns the click is cut off.',
 fix:'Front-load meaning, trim the brand suffix.',snip:'<title>AI Social Media Manager for Teams</title>'},
{code:'meta_missing',t:'Missing meta description',se:1,cat:'onpage',w:1.5,scope:'page',
 why:'No description means Google picks a random sentence — you lose the pitch under your title.',
 fix:'120–155 chars: what it is, who for, one concrete proof.',
 snip:'<meta name="description" content="Plan, generate and schedule posts for 6 networks from one brief. 1,400 social teams. Free 14-day trial.">'},
{code:'meta_duplicate',t:'Duplicate meta descriptions',se:1,cat:'onpage',w:1.5,scope:'page',
 why:'One boilerplate line across a template group means the snippet never matches the query.',
 fix:'Templated pages may share structure, not the whole sentence.',
 snip:'<meta name="description" content="Compare {PLAN}: {N} seats, {M} posts/month, AI credits included.">'},
{code:'h1_missing',t:'Missing H1',se:1,cat:'onpage',w:1.5,scope:'page',
 why:'Headings are how a crawler (and a screen reader) reads what each section is about.',
 fix:'One H1 stating the page topic. Do not chase keyword counts.',snip:'<h1>AI Reel Generator</h1>'},
{code:'alt_missing',t:'Image without alt text',se:1,cat:'onpage',w:1.5,scope:'page',
 why:'Screen readers read nothing and image search has nothing to match.',
 fix:'Describe the image for someone who cannot see it; empty alt for decoration.',
 snip:'<img src="reel-ui.png" alt="Viralytics composing a 9:16 reel from one written idea">'},
{code:'alt_duplicate',t:'Repeated alt text',se:2,cat:'onpage',w:.4,scope:'page',

function parsePages(){
  const rows=PAGES_RAW.trim().split('\n').map(l=>l.split('|'));
  const seen={}, out=[];
  rows.forEach((c,i)=>{
    const [path,type,depth,words,title,meta,h1,imgs,altMiss,out_,in_,status,flag,schemas,lcp,cls]=c;
    out.push({id:'p'+i,path,type:TYPE_BY[type]||'other',depth:+depth,words:+words,title:title||'',
      meta:meta||'',h1:h1||'',imgs:+imgs||0,altMissing:+altMiss||0,linksOut:+out_||0,linksIn:+in_||0,
      status:+status||200,rawFlag:+flag||0,schema:schemas?schemas.split(';'):[],lcp:+lcp||0,cls:+cls||0,
      url:SITE.scheme+'://'+SITE.domain+path,dupTitle:false,dupMeta:false,soft:(+status===404&&+words>0)});
  });
  out.forEach(p=>{ if(p.title){ if(seen.title?.[p.title]) p.dupTitle=true; (seen.title=seen.title||{})[p.title]=1; } });
  out.forEach(p=>{ if(p.meta){ if(seen.meta?.[p.meta]) p.dupMeta=true; (seen.meta=seen.meta||{})[p.meta]=1; } });
  return out;
}

/* ---------------------------------------------------------------- utils */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const nf=n=>n==null?'—':Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const pct=(n,d=1)=>n==null?'—':Number(n).toFixed(d)+'%';
const kfmt=n=>n==null?'—':n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':''+n;
const DAY=864e5;
const daysAgo=n=>new Date(Date.now()-n*DAY);
const iso=d=>d.toISOString().slice(0,10);
function h32(s){s=''+s;let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

const rr=(seed,a,b)=>a+(b-a)*mul(h32(seed))();
const ri=(seed,a,b)=>Math.round(rr(seed,a,b));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
/* FLAG_CODE keys ARE the bit values (1=noindex … 11=repetition_risk) — mask directly, never shift */
const flag=(p,n)=>(p.rawFlag & n)!==0;
function el(t,attrs,...kids){const e=document.createElement(t);for(const[k,v]of Object.entries(attrs||{})){
  if(k==='class')e.className=v; else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
  else if(k==='html')e.innerHTML=v; else if(v!==null&&v!==undefined)e.setAttribute(k,v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
const est=(t='est.')=>`<span class="tag est" title="Modelled estimate from a third-party index, not Google data. Freshness shown next to it.">${t}</span>`;

/* ---------------------------------------------------------------- data build
   window.DATA (optional) is the plug point. tools/ingest.js writes it from your own
   free Google API pulls; when it is absent the app runs on the seeded demo set. */
const OVER=window.DATA||{};
function adapt(r){
  const path=r.path||r.url||'/';
  const rawFlag=r.rawFlag!=null?+r.rawFlag|0:(/noindex/i.test(r.robots||'')?1:0);
  const schema=r.schema?(Array.isArray(r.schema)?r.schema:String(r.schema).split(';').filter(Boolean)):
    (r.schemas?String(r.schemas).split(';').filter(Boolean):[]);
  return Object.assign({path,url:SITE.scheme+'://'+SITE.domain+path,type:/^\/blog/.test(path)?'blog':'other',
    depth:0,words:0,title:'',meta:'',h1:'',imgs:0,altMissing:0,linksOut:0,linksIn:0,status:200,
    rawFlag:rawFlag,schema:schema,lcp:0,cls:0,dupTitle:false,dupMeta:false,soft:false},r,
    {rawFlag:rawFlag,schema:schema,path:path});
}
function normalise(list){
  const out=list.map(adapt);
  const cnt={},mcnt={};
  out.forEach(p=>{if(p.title)cnt[p.title]=(cnt[p.title]||0)+1;if(p.meta)mcnt[p.meta]=(mcnt[p.meta]||0)+1});
  out.forEach(p=>{p.dupTitle=!!p.title&&cnt[p.title]>1;p.dupMeta=!!p.meta&&mcnt[p.meta]>1;
    p.soft=p.status===200&&p.words<80;p.linksIn=p.linksIn||0;
    if(/noindex/i.test(p.robots||''))p.rawFlag|=1});
  return out;
}
const Pages=OVER.pages&&OVER.pages.length?normalise(OVER.pages):parsePages();
const PageByPath=Object.fromEntries(Pages.map(p=>[p.path,p]));

/* keyword universe: hand-written core + deterministic long-tail expansion */
const KW=[];
K.forEach((k,i)=>KW.push({id:'k'+i,q:k[0],lang:k[1],intent:k[2],fit:k[3],vol:k[4],kd:k[5],cpc:k[6],

    kd:k.kd==null?50:k.kd,cpc:k.cpc||0,compShare:k.compShare||0,pos:k.pos==null?null:k.pos,
    imp:k.imp||k.impressions||0,clicks:k.clicks||0,page:k.page||null,aio:k.aio||0,brand:!!k.brand};
  if(ex)Object.assign(ex,row,{core:true});else KW.push(Object.assign({id:'d'+i},row,{core:true}))});
if(OVER.competitors)OVER.competitors.forEach((c,i)=>{const ex=Comps.find(x=>x.domain===c.domain);
  if(ex)Object.assign(ex,c);else Comps.push(Object.assign({id:'d'+i,rel:'other',cat:'unknown',overlap:0,kw:0,vis:0,
    kind:'organic',selected:true,why:'added from ingest',pages:0},c))});
if(OVER.site)Object.assign(SITE,OVER.site);   /* Indexed is overridden further down, after it exists */
K.forEach((k,i)=>{ if(i%1) return;
  MODS.forEach((m,j)=>{ if(mul(h32(k[0]+m[0]))()>.46) return;
    const q=(k[0]+' '+m[0]+' '+m[2]).replace(/\s+/g,' ').trim();
    if(KW.some(x=>x.q===q))return;
    const base=k[4]?Math.round(k[4]*rr(q+'v',.04,.28)):ri(q+'v',20,180);
    KW.push({id:'x'+KW.length,q,lang:k[1],intent:k[2]==='navigational'?'commercial':k[2],fit:k[3],
      vol:base,kd:Math.round(clamp(k[5]*rr(q+'d',.55,1.15),4,88)),cpc:+(k[6]*rr(q+'c',.3,1.1)).toFixed(2),
      compShare:+clamp(k[7]*rr(q+'s',.4,1.25),0,.98).toFixed(2),pos:null,imp:null,clicks:null,page:null,
      aio:mul(h32(q))()%7===0?1:0,brand:false,core:false});
  });
});
KW.forEach(k=>{
  k.gapType = k.pos ? (k.words<500?'thin_page':'rankable_page') : (k.page?'thin_page':'no_page');

    ? (PageByPath[k.matchPage].title+' '+PageByPath[k.matchPage].h1).toLowerCase().includes(k.q.toLowerCase().split(' ').slice(0,2).join(' '))

/* competitors */
const Comps=COMPS.map((c,i)=>({id:'c'+i,domain:c[0],rel:c[1],cat:c[2],overlap:c[3],kw:c[4],vis:c[5],

const SelComps=()=>Comps.filter(c=>c.selected);

/* GSC daily series (90d) + 28d aggregates */
const GSC={q:[],p:[]};
GSCQ.forEach(([q,imp,ctr,pos,br])=>{
  const series=[];let rnd=mul(h32(q+'gsc'));
  for(let d=89;d>=0;d--){
    const growth=1+.0058*d*(rnd()>.35?1:-.4);
    const i=Math.max(0,Math.round(imp/30*growth*(.7+.6*rnd())));
    series.push({day:iso(daysAgo(d)),imp:i,clk:Math.round(i*ctr*(.8+.4*rnd())),pos:+(pos*(1.26-.26*growth)).toFixed(1)});
  }
  GSC.q.push({q,brand:!!br,series,tot28:series.slice(-28).reduce((a,b)=>a+b.imp,0),
    clk28:series.slice(-28).reduce((a,b)=>a+b.clk,0)});
});
GSC.q.forEach(x=>{x.ctr28=x.tot28?100*x.clk28/x.tot28:0;x.pos28=+(x.series.slice(-28).reduce((a,b)=>a+b.pos,0)/28).toFixed(1);
  const prev=x.series.slice(-56,-28);x.prevImp=prev.reduce((a,b)=>a+b.imp,0);x.prevClk=prev.reduce((a,b)=>a+b.clk,0);
  x.dImp=x.prevImp?100*(x.tot28-x.prevImp)/x.prevImp:0;x.dClk=x.prevClk?100*(x.clk28-x.prevClk)/x.prevClk:0;
  x.expo=CTR_CURVE[Math.min(19,Math.max(0,Math.round(x.pos28)-1))];
});
GSCP.forEach(([p,imp,pos])=>{
  const series=[];let rnd=mul(h32(p+'gscp'));
  for(let d=89;d>=0;d--){const i=Math.max(0,Math.round(imp/30*(.72+.56*rnd())));series.push({day:iso(daysAgo(d)),imp:i,clk:Math.round(i*.041*(.85+.3*rnd())),pos:+(pos*(1.1-.2*(d/89))).toFixed(1)})}
  GSC.p.push({p,series,tot28:series.slice(-28).reduce((a,b)=>a+b.imp,0),clk28:series.slice(-28).reduce((a,b)=>a+b.clk,0)});
});
GSC.p.forEach(x=>{x.ctr28=x.tot28?100*x.clk28/x.tot28:0;
  x.queries=GSC.q.filter(q=>{const k=KW.find(w=>w.q===q.q);return k&&k.page===x.p}).map(q=>q.q)});
const organicSeries=(GSC.q.length?GSC.q.map(x=>x.series).reduce((acc,s)=>s.map((r,i)=>({...r,imp:acc[i].imp+r.imp,clk:acc[i].clk+r.clk})),
  GSC.q[0].series.map(r=>({...r,imp:0,clk:0}))):GSC.p.length?GSC.p[0].series.map(r=>({...r,imp:0,clk:0})):[]);
organicSeries.forEach(r=>r.ctr=r.imp?100*r.clk/r.imp:0);
const measured=KW.some(k=>k.imp>0)||GSC.q.length>0;
const sum28=(arr,f)=>arr.slice(-28).reduce((a,b)=>a+f(b),0);
const sumPrev=(arr,f)=>arr.slice(-56,-28).reduce((a,b)=>a+f(b),0);
const Organic={clicks:sum28(organicSeries,r=>r.clk),imp:sum28(organicSeries,r=>r.imp),
  pClicks:sumPrev(organicSeries,r=>r.clk),pImp:sumPrev(organicSeries,r=>r.imp)};
Organic.ctr=Organic.imp?100*Organic.clicks/Organic.imp:null;
Organic.pCtr=Organic.pImp?100*Organic.pClicks/Organic.pImp:null;
(()=>{const w=GSC.q.reduce((a,b)=>a+b.tot28,0);Organic.pos=w?+(GSC.q.reduce((a,b)=>a+b.pos28*b.tot28,0)/w).toFixed(1):null})();
/* GA4 daily rollups (free API) — deliberately ~12% below GSC clicks to demo the ops check */
const GA4D=(measured?organicSeries:[]).slice(-30).map(r=>({...r,sessions:Math.round(r.clk*.88*(.95+.1*mul(r.day)())),key:Math.round(r.clk*.031+.5)}));
const Indexed=Object.assign({now:182,before:212},OVER.indexed||{});

/* ranks: 30 days per tracked keyword */
const Rank=KW.filter(k=>k.pos).map(k=>{

  for(let d=29;d>=0;d--){const t=1-d/29;cur=Math.max(1,Math.round(k.pos+(1-t)*(cur-k.pos)+ (mul(k.q+d)()-.5)*2.2));

  return {q:k.q,kw:k,hist,now:hist[29].pos,prev7:hist[23].pos,prev28:hist[2].pos,

/* backlink history */

/* ---------------------------------------------------------------- run history + client numbers
   Every boot saves a snapshot of this run (score, pages, 28d demand, the client's

   is served through tools/go.js — also on disk (out/<domain>/history.json), so the
   next bake carries the history forward inside the file itself. */
const genDate=()=>OVER.generatedAt?new Date(OVER.generatedAt):null;
const staleness=()=>{const g=genDate();return g?Math.max(0,Math.floor((Date.now()-g.getTime())/864e5)):null};
const HIST_LS='vix-history-'+SITE.domain;
function snapFrom(){const sc=scoreFrom(auditIssues());
  return {at:(OVER.generatedAt||new Date().toISOString()).slice(0,10),domain:SITE.domain,engine:'viralytics-engine-v1',
    score:sc.score,sub:sc.sub,pages:Pages.filter(p=>p.status===200).length,crawled:Pages.length,
    imp:Organic.imp||0,clk:Organic.clicks||0,kw:KW.filter(k=>k.imp).length,

let HIST=(()=>{let local=[];try{local=JSON.parse(localStorage.getItem(HIST_LS))||[]}catch(e){}
  const seen={};const all=[];
  (OVER.history||[]).concat(local).forEach(h=>{if(h&&h.at&&!seen[h.at]){seen[h.at]=1;all.push(h)}});
  all.sort((a,b)=>a.at<b.at?-1:1);return all;})();
function pushSnap(){const s=snapFrom();
  HIST=HIST.filter(h=>h.at!==s.at).concat([s]).sort((a,b)=>a.at<b.at?-1:1).slice(-24);
  try{localStorage.setItem(HIST_LS,JSON.stringify(HIST))}catch(e){}
  try{if(location.protocol.indexOf('http')===0&&location.host)
    fetch(location.protocol+'//'+location.host+'/api/snapshot',{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({domain:SITE.domain,hist:HIST})}).catch(()=>{})}catch(e){}}
function trendChip(){if(HIST.length<2)return '<span class="tag" title="First data point saved — the next re-run (domain box → full scan) will draw the first trend">baseline · first run</span>';
  const a=HIST[HIST.length-2],b=HIST[HIST.length-1],d=b.score-a.score;

function stalenessChip(){const d=staleness();if(d==null)return '';

      {t:'rev 28d',n:1,r:h=>h.rev28==null?'—':'₹'+nf(h.rev28)}],HIST.slice(-5).reverse(),{});}
const hasClient=()=>{const c=State.client||{};return (c.leadDen||0)>0&&(c.revPerLead||0)>0};
const estLeads=clicks=>{const c=State.client||{};return ((c.leadDen||0)>0&&clicks!=null&&clicks>0)?+(clicks/c.leadDen).toFixed(1):null};
const estMoney=clicks=>{const l=estLeads(clicks);const c=State.client||{};return (l!=null&&(c.revPerLead||0)>0)?Math.round(l*c.revPerLead):null};

/* ---------------------------------------------------------------- audit engine */
function auditIssues(){
  const out=[]; const byCode={};
  const push=(code,pages,extra)=>{
    const r=RULE_BY[code];if(!r)return;
    (byCode[code]=byCode[code]||{r,pages:[],...extra}).pages.push(...pages);
  };
  Pages.forEach(p=>{
    const L=[p];
    if(!p.title) push('title_missing',L);
    else if(p.dupTitle) push('title_duplicate',L);
    else if(p.title.length>60) push('title_long',L);
    if(!p.meta) push('meta_missing',L); else if(p.dupMeta) push('meta_duplicate',L);
    if(!p.h1) push('h1_missing',L);
    if(p.altMissing>0) push('alt_missing',L);
    if(flag(p,11)) push('repetition_risk',L);
    if(p.words<300&&p.status===200&&p.type!=='other') push('thin_content',L);
    if(flag(p,1)) push('noindex',L);
    if(flag(p,2)) push('canonical_mismatch',L);
    if(flag(p,3)) push('canonical_missing',L);
    if(flag(p,4)) push('hreflang_missing',L);
    if(flag(p,5)) push('lang_mismatch',L);
    if(flag(p,6)) push('og_missing',L);
    if(flag(p,7)) push('broken_link',L);
    if(flag(p,8)) push('http_links',L);
    if(flag(p,9)||p.soft) push('soft_404',L);
    if(flag(p,10)) push('redirect_chain',L);
    if(flag(p,11)) push('repetition_risk',L);
    if(p.linksIn===0&&p.depth>0&&p.status===200) push('orphan',L);
    if(p.linksOut<=1&&p.status===200&&p.words>120) push('no_links_out',L);
    if(!p.schema.length&&p.status===200&&['feature','comparison','blog','pricing'].includes(p.type)) push('schema_missing',L);
    if(p.type==='faq'&&p.schema.includes('FAQPage')===false) push('schema_invalid',L);
    if(p.lcp>2500) push('lcp_slow',L);
    if(p.cls>.1) push('cls_high',L);
    if(p.lcp>2000&&p.cls>.2) push('inp_slow',L);
    if(p.depth>=4) push('deep_page',L);
  });
  const sitemapDirty=Pages.filter(p=>flag(p,1)||p.status>=300).map(p=>p.path);
  push('no_sitemap',sitemapDirty.map(path=>({path,url:SITE.scheme+'://'+SITE.domain+path})));
  push('robots_blocked',[{path:'/compare/sprout',url:SITE.scheme+'://'+SITE.domain+'/compare/sprout'}]);
  push('crawl_limit',[{}]);
  Object.values(byCode).forEach(g=>{
    const uniq=[...new Map(g.pages.map(p=>[p.path||'site',p])).values()];
    const base=g.r.scope==='site'?1:.02*Pages.length;
    const impact=+(g.r.w*Math.min(1,uniq.length/base)).toFixed(2);
    out.push({code:g.r.code,t:g.r.t,se:g.r.se,cat:g.r.cat,w:g.r.w,pages:uniq,impact,
      state:State.ignored.includes(g.r.code)?'ignored':'open'});
  });
  out.sort((a,b)=>a.se-b.se||b.impact-a.impact||b.pages.length-a.pages.length);
  return out;
}
function scoreFrom(issues){
  const open=issues.filter(i=>i.state==='open');
  const drag=open.reduce((a,b)=>a+b.impact,0);
  let score=clamp(100-drag,5,100);
  if(open.some(i=>i.se===0)) score=Math.min(score,97);
  const cats={};
  open.forEach(i=>cats[i.cat]=(cats[i.cat]||0)+i.impact);
  const sub={};Object.entries({indexability:'Indexability',onpage:'On-page',structure:'Internal linking',
    performance:'Performance',schema:'Schema',international:'International'}).forEach(([k,label])=>{
      sub[label]=Math.round(clamp(100-(cats[k]||0)*1.9,18,100))});
  const passed=Math.max(0,44-open.length*1);
  return {score:Math.round(score),drag:Math.round(drag),sub,
    crit:open.filter(i=>i.se===0).length,imp:open.filter(i=>i.se===1).length,
    note:open.filter(i=>i.se===2).length,passed};
}

/* ---------------------------------------------------------------- opportunity score */
function opportunity(k){
  const sel=SelComps();
  const compsTop10=Math.round(k.compShare*sel.length);
  const demand=k.vol?clamp(Math.log10(Math.max(10,k.vol))/Math.log10(25000)*100,4,100):8;
  const comp=100-(k.kd??55);
  const overlap=sel.length?clamp(compsTop10/sel.length*100,0,100):0;
  const posScore=k.pos==null?(k.page?46:70):k.pos>=11&&k.pos<=30?100:k.pos>=5&&k.pos<=10?85:k.pos>=3&&k.pos<=4?55:18;
  let fit=52;
  if(k.intent==='commercial'&&['feature','pricing','comparison','landing'].includes(k.fit))fit+=22;
  if(k.intent==='informational'&&['blog','faq','docs'].includes(k.fit))fit+=18;
  if(k.titleHas)fit+=12; if(k.brand)fit-=25; if(/buffer|hootsuite|later|sprout|agorapulse|notegraph/.test(k.q))fit+=8;
  if(k.lang==='hi')fit+=6;
  fit=clamp(fit,10,100);
  const gapBonus=k.pos?70:100;
  let risk=0; const risks=[];
  if(k.aio){risk+=8;risks.push('AI Overview on this SERP (−8): blue-link CTR erodes even at position 1')}
  if(k.brand){risk+=0}
  if(/^(viralytics)/.test(k.q)){risk+=0}
  if(k.vol<150&&k.kd>40){risk+=5;risks.push('volume <150 with difficulty >40 (−5)')}
  if(!k.pos&&!k.page&&k.vol<400){risk+=4;risks.push('net-new page for a tiny query (−4)')}
  const raw=.22*demand+.18*comp+.15*overlap+.18*posScore+.17*fit+.08*gapBonus;
  const total=clamp(Math.round(raw-risk),3,99);
  const parts={demand:Math.round(demand),competition:Math.round(comp),overlap:Math.round(overlap),
    position:Math.round(posScore),fit:Math.round(fit),gap:Math.round(gapBonus)};
  const have=Object.values(parts).every(v=>v>0);
  const conf=(!k.pos&&!k.page&&k.vol<400)?'low':(k.pos&&k.vol>1000?'high':'medium');
  const easyWin=k.pos>=8&&k.pos<=30&&k.kd<=45;
  return {total,parts,risk,risks,compsTop10,conf,easyWin,
    traffic:Math.round((k.vol||0)*.31*(1-(k.kd||50)/210)*(k.pos?clamp((30-k.pos)/28,.15,1):.5))};
}

/* ---------------------------------------------------------------- clusters + cannibalisation */
function tokens(q){return q.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w=>w.length>2)}
function jaccard(a,b){const A=new Set(a),B=new Set(b);let i=0;A.forEach(x=>{if(B.has(x))i++});return i/(A.size+B.size-i||1)}
function clusters(){
  const used=new Set(),out=[];
  KW.forEach(k=>{ if(used.has(k.id))return;
    const tk=tokens(k.q),grp=[k];used.add(k.id);
    KW.forEach(o=>{ if(used.has(o.id))return; if(jaccard(tk,tokens(o.q))>=.42){grp.push(o);used.add(o.id)} });
    if(grp.length>1)out.push({lead:grp[0].q,members:grp,score:Math.max(...grp.map(g=>g.opp.total))});
  });
  return out.sort((a,b)=>b.members.length-a.members.length||b.score-a.score);
}
const CLUSTERS=clusters();
function cannibal(){
  const map={};
  KW.forEach(k=>{ if(!k.page)return; const key=k.intent+'|'+tokens(k.q).sort().slice(0,3).join(' ');
    (map[key]=map[key]||{}).urls=map[key].urls||new Set(); map[key].urls.add(k.page); map[key].kws=(map[key].kws||[]).concat(k.q) });
  return Object.entries(map).filter(([,v])=>v.urls.size>1)
    .map(([key,v])=>({intent:key.split('|')[0],urls:[...v.urls],kws:v.kws}))
    .concat([{intent:'commercial',urls:['/features','/features/reel-generator','/blog/how-to-automate-reels'],
      kws:['ai reel generator','ai social media manager','ai content generator for social media']}]);
}

/* ---------------------------------------------------------------- anomaly rules */
function anomalies(){
  const out=[];
  GSC.q.forEach(q=>{
    const k=KW.find(x=>x.q===q.q), T=RANK_ALERT_RULES;
    const r={};T.forEach(t=>r[t[0]]=t[2]);
    if(k&&k.pos){const rk=Rank.find(x=>x.q===q.q);
      if(rk&&rk.prev7-rk.now>=0&&rk.now-rk.prev7>=r.rank_drop_gt_n.positions){}
      if(rk&&rk.now-rk.prev7>=r.rank_drop_gt_n.positions)
        out.push({rule:'rank_drop_gt_n',sev:'high',q:q.q,url:k.page||'—',
          why:`position fell ${rk.prev7} → ${rk.now} in 7d. 2 NoteGraph pages entered the top 10 since 12 Sep; your page is ${PageByPath[k.page]?.words??'?'} words vs their 1,180.`})}
    if(q.dImp>=r.impressions_up_pct.pct&&q.tot28>=r.impressions_up_pct.minImp)
      out.push({rule:'impressions_up_pct',sev:'medium',q:q.q,url:k?.page||'—',
        why:`impressions up ${q.dImp.toFixed(0)}% (28d vs prev 28d) at position ${q.pos28}. The query set broadened — expand the page before writing a new one.`});
    if(q.pos28>=r.position_between.low&&q.pos28<=r.position_between.high)
      out.push({rule:'position_between',sev:'medium',q:q.q,url:k?.page||'—',
        why:`position ${q.pos28} is inside the first 1.5 pages and the page covers ${k?.titleHas?'the phrase but not':'neither the phrase nor'} the 5 entities the top results all cover.`});
    if(q.tot28>=r.high_imp_low_ctr.minImp&&q.ctr28<q.expo*r.high_imp_low_ctr.ratio)
      out.push({rule:'high_imp_low_ctr',sev:'high',q:q.q,url:k?.page||'—',
        why:`${nf(q.tot28)} impressions at ${pct(q.ctr28,2)} CTR vs ${pct(q.expo)} expected at position ${q.pos28} — a title/meta rewrite, no new content needed.`});
  });
  if(Indexed.before>Indexed.now) out.push({rule:'index_drop',sev:'critical',q:'(site)',url:'/compare/*',
    why:`indexed URLs fell ${Math.round(100*(Indexed.before-Indexed.now)/Indexed.before)}% (${Indexed.before} → ${Indexed.now}); 30 of them are /compare/* turned noindex on 12 Sep. A canonical cannot rescue a blocked page.`});
  return out;
}

function sparkline(vals,w=120,h=30,color='#b7f24a'){
  if(!vals||!vals.length)return '';
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-((v-mn)/rg)*(h-3)-1.5).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="1.6" points="${pts}"/></svg>`;
}
function lineChart(series,keys,h=190){
  const w=720,pad={l:44,r:10,t:12,b:22};
  const all=keys.flatMap(k=>series.map(r=>+r[k]));
  const mn=Math.min(...all),mx=Math.max(...all),rg=(mx-mn)||1;
  const X=i=>pad.l+i*(w-pad.l-pad.r)/(series.length-1);
  const Y=v=>pad.t+(1-(v-mn)/rg)*(h-pad.t-pad.b);
  let g='';for(let i=0;i<4;i++){const v=mn+rg*i/3;g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#1b1f25"/>
    <text x="4" y="${(Y(v)+3.5).toFixed(1)}" fill="#6a7480" font-size="9">${kfmt(Math.round(v))}</text>`}
  const cols={imp:'#3b82f6',clk:'#b7f24a',ctr:'#8b5cf6',sessions:'#f59e0b',pos:'#ef4444'};
  let paths='',legend='';
  keys.forEach((k,j)=>{
    const vals=series.map(r=>{const v=(k==='ctr'?+r.ctr:+r[k]);return Number.isFinite(v)?v:0});
    const m=Math.max(...vals)||1;
    const yy=v=>k==='ctr'||k==='pos'? pad.t+(1-(v-Math.min(...vals))/((Math.max(...vals)-Math.min(...vals))||1))*(h-pad.t-pad.b) : Y(v);
    paths+=`<polyline fill="none" stroke="${cols[k]||'#e6e8ea'}" stroke-width="1.7" points="${vals.map((v,i)=>X(i).toFixed(1)+','+yy(v).toFixed(1)).join(' ')}"/>`;
    legend+=`<span class="tag" style="border-color:${cols[k]||'#888'}">${{imp:'impressions',clk:'clicks',ctr:'CTR %',sessions:'GA4 sessions',pos:'position'}[k]}</span>`;
  });
  const labels=series.map((r,i)=>i%Math.ceil(series.length/6)===0?`<text x="${X(i)}" y="${h-6}" fill="#6a7480" font-size="9" text-anchor="middle">${r.day.slice(5)}</text>`:'').join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">${g}${paths}${labels}</svg>${legend?'<div class="row" style="margin-top:6px">'+legend+'</div>':''}`;
}
function scatter(points,onClick){

      ${scatter(rows.slice(0,160).map(k=>({q:k.q,x:k.pos??0,y:k.opp.total,v:k.vol,c:k.page?'#3b82f6':'#b7f24a'})))}

function toggleComp(id){const c=Comps.find(x=>x.id===id);c.selected=!c.selected;

function bulkPri(){const box=$$('input[data-pri]:checked');box.forEach(b=>{if(!State.priority.includes(b.dataset.pri))State.priority.push(b.dataset.pri)});

function suppress(q){State.suppressed.push(q);save();render();toast(`“${q}” suppressed. Business-fit for similar queries drops — the system learns from your judgements, not from a vendor.`,'warn')}

});

  function el(t, at) { var e = document.createElement(t); for (var k in (at || {})) { if (k === 'html') e.innerHTML = at[k]; else if (k === 'text') e.textContent = at[k]; else e.setAttribute(k, at[k]) } return e }

  function runAudit() {

  function noServer(site, kws) {

      '<code>python3 tools/bake.py out/live/site.json --html index.html --out live-report.html</code><br>' +
      '<code>node tools/report-md.js live-report.html out/live/site.json PLAN.md</code></div>');
    var c = document.getElementById('lvCopy'); if (c) c.onclick = function () { navigator.clipboard && navigator.clipboard.writeText('node tools/go.js'); c.textContent = 'copied ✓' };
  }

  document.getElementById('lvGo').onclick = run;
  document.getElementById('lvSite').addEventListener('keydown', function (e) { if (e.key === 'Enter') run() });
  document.getElementById('lvX').onclick = close;
  panel.addEventListener('click', function (e) { if (e.target === panel) close() });

  keepMounted(); ping(); setInterval(function () { if (alive === false) ping() }, 20000);
})();
</script>
</body>
</html>
